<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga a Flota - Móvil EVOLTS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070a14;
            --bg-card: #111827;
            --border-color: #1e293b;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-blue: #2563EB;
            --accent-cyan: #0EA5E9;
            --accent-amber: #F59E0B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .form-container { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 12px; }
        .logo-box { background: radial-gradient(circle at center, rgba(30, 58, 138, 0.4) 0%, rgba(11, 17, 32, 0.9) 100%); border: 1px solid rgba(96, 165, 250, 0.35); padding: 10px 14px; border-radius: 12px; text-align: center; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5); }
        .logo-box img { max-height: 45px; height: auto; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7)); }
        .form-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .form-header h2 { font-size: 13.5px; color: white; display: flex; align-items: center; gap: 6px; }
        .form-header h2 i { color: var(--accent-cyan); }
        .btn-volver { background: #1F2937; color: var(--text-muted); border: 1px solid var(--border-color); padding: 5px 8px; border-radius: 8px; font-size: 11px; text-decoration: none; }
        .step-indicator { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .step-content { display: none; flex-direction: column; gap: 10px; animation: fadeIn 0.25s ease-in-out; }
        .step-content.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .form-control { background-color: #1F2937; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; color: white; font-size: 15px; outline: none; width: 100%; }
        .form-control:focus { border-color: var(--accent-cyan); }
        .form-control[readonly] { background-color: #111827; color: #93C5FD; border-color: rgba(147, 197, 253, 0.3); cursor: not-allowed; font-weight: 600; }
        .odometer-hint { background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.3); border-radius: 8px; padding: 8px; font-size: 11.5px; color: #38BDF8; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .suggestions-box { background: #1F2937; border: 1px solid var(--border-color); border-radius: 8px; max-height: 110px; overflow-y: auto; display: none; margin-top: -4px; }
        .suggestion-item { padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: #93C5FD; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .suggestion-item:hover { background: rgba(37, 99, 235, 0.3); color: white; }
        .step-buttons { display: flex; gap: 8px; margin-top: 4px; }
        .btn-step { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-next, .btn-submit { background: linear-gradient(135deg, var(--accent-blue) 0%, #1D4ED8 100%); color: white; }
        .btn-prev { background: #374151; color: var(--text-main); flex: 0.4; }
        .footer-signature { text-align: center; padding-top: 6px; font-size: 10px; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.05); width: 100%; margin-top: 6px; }
        .footer-signature strong { color: #93C5FD; font-weight: 600; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="logo-box">
            <img src="logoEVOLTS.png" alt="EVOLTS Ingeniería y Construcción">
            <div style="font-size: 10.5px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase;">Control Operativo Camión Cisterna</div>
        </div>
        <div class="form-header">
            <h2><i class="fa-solid fa-gas-pump"></i> Carga a Flota (Paso a Paso)</h2>
            <a href="mobile_index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Menú</a>
        </div>
        <div class="step-indicator">
            <span id="lblStepIndicator">Paso 1 de 5</span>
            <span id="lblStepTitle" style="color: var(--accent-cyan);">Patente</span>
        </div>
        <form id="formCargaMóvil" onsubmit="finalizarCarga(event)">
            
            <!-- PASO 1: PATENTE -->
            <div class="step-content active" id="step-1">
                <label>Buscar Patente (Empieza con...)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="txtPatente" class="form-control" placeholder="Ej: H..." maxlength="6" oninput="filtrarPatentes(this)" autocomplete="off" style="flex: 1.2;">
                    <input type="text" id="txtPatenteVisual" class="form-control" placeholder="Modelo / Conductor..." readonly style="flex: 1.8; background: #0f172a; color: #34D399; font-size: 12px;">
                </div>
                <div id="sugerenciasPatentes" class="suggestions-box"></div>
                <div class="step-buttons" style="margin-top: 8px;">
                    <button type="button" class="btn-step btn-next" onclick="validarYPasar(1)">Siguiente <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- PASO 2: LITROS -->
            <div class="step-content" id="step-2">
                <label>Litros Cargados</label>
                <input type="number" step="0.01" min="0" id="txtLitros" class="form-control" placeholder="0.00" inputmode="decimal" onkeydown="bloquearLetrasCientificas(event)">
                <div class="step-buttons">
                    <button type="button" class="btn-step btn-prev" onclick="cambiarPaso(1)"><i class="fa-solid fa-arrow-left"></i></button>
                    <button type="button" class="btn-step btn-next" onclick="validarYPasar(2)">Siguiente <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- PASO 3: ODÓMETRO DEL VEHÍCULO -->
            <div class="step-content" id="step-3">
                <label>Odómetro Actual del Vehículo (Km)</label>
                <div class="odometer-hint" id="hintOdodmetro">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="txtUltimoOdometroVehiculo">Consultando último registro...</span>
                </div>
                <input type="number" step="1" min="0" id="txtOdometro" class="form-control" placeholder="Ej: 45200" inputmode="numeric" onkeydown="bloquearLetrasCientificas(event)">
                <div class="step-buttons">
                    <button type="button" class="btn-step btn-prev" onclick="cambiarPaso(2)"><i class="fa-solid fa-arrow-left"></i></button>
                    <button type="button" class="btn-step btn-next" onclick="validarYPasar(3)">Siguiente <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- PASO 4: ODÓMETRO / HORÓMETRO FINAL DE BOMBA (CISSERNA) -->
            <div class="step-content" id="step-4">
                <label>Odómetro / Horómetro Final de Bomba</label>
                <div class="odometer-hint">
                    <i class="fa-solid fa-gauge"></i> <span id="lblOdometroBaseCisterna">Cargando base anterior...</span>
                </div>
                <input type="number" step="any" min="0" id="txtOdometroFinalBomba" class="form-control" placeholder="Ej: 147625" inputmode="numeric" onkeydown="bloquearLetrasCientificas(event)">
                <div class="step-buttons" style="margin-top: 12px;">
                    <button type="button" class="btn-step btn-prev" onclick="cambiarPaso(3)"><i class="fa-solid fa-arrow-left"></i></button>
                    <button type="button" class="btn-step btn-next" onclick="validarYPasar(4)">Siguiente <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- PASO 5: PERSONA QUE CARGA Y CONFIRMACIÓN -->
            <div class="step-content" id="step-5">
                <label>Persona que Carga (Conductor / Operador)</label>
                <input type="text" id="txtPersonaCarga" class="form-control" placeholder="Nombre completo" autocomplete="off" style="margin-bottom: 6px;">
                
                <div style="background: #1F2937; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; font-size: 11.5px; display: flex; flex-direction: column; gap: 4px;">
                    <div><span style="color: var(--text-muted);">Patente:</span> <strong id="resPatente" style="color: white;">-</strong></div>
                    <div><span style="color: var(--text-muted);">Litros:</span> <strong id="resLitros" style="color: #6EE7B7;">-</strong></div>
                    <div><span style="color: var(--text-muted);">Odómetro Bomba Final:</span> <strong id="resOdometroBomba" style="color: #38BDF8;">-</strong></div>
                </div>

                <div class="step-buttons">
                    <button type="button" class="btn-step btn-prev" onclick="cambiarPaso(4)"><i class="fa-solid fa-arrow-left"></i></button>
                    <button type="submit" class="btn-step btn-submit" id="btnGuardar"><i class="fa-solid fa-floppy-disk"></i> Guardar Carga</button>
                </div>
            </div>
        </form>
    </div>
    <footer class="footer-signature">
        EVOLTS Ltda. • Desarrollado por <strong>David G. Parraguez Suazo</strong>
    </footer>
    <script>
        const SUPABASE_URL = 'https://dkgxrbxmdhlosfsbzikm.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_5i71qWRXd_TesqWYrtckLA_eoOwQm5U';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let pasoActual = 1;
        const totalPasos = 5;
        const nombresPasos = ["Patente", "Litros", "Odómetro Vehículo", "Odómetro Bomba", "Confirmar"];
        let diccionarioVehiculos = {}; 
        let ultimoOdometroVehiculoReg = 0;
        let odometroBaseCisterna = 0;

        window.onload = async function() {
            try {
                const { data, error } = await _supabase.from('vehiculos').select('*');
                if (!error && data) {
                    data.forEach(v => {
                        const pat = (v.patente || '').trim().toUpperCase();
                        if (pat) {
                            diccionarioVehiculos[pat] = {
                                tipo: v.tipo || 'GENERAL',
                                marca_modelo: v.marca_modelo || v.modelo || 'NO ESPECIFICADO',
                                conductor_titular: v.conductor_titular || v.conductor || 'SIN ASIGNAR'
                            };
                        }
                    });
                }

                // HERENCIA AUTOMÁTICA DEL ODÓMETRO BASE DE BOMBA
                const ahora = new Date();
                const fechaHoyStr = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, '0')}-${String(ahora.getDate()).padStart(2, '0')}`;
                const { data: cierreHoy } = await _supabase.from('cierre_diario_cisterna').select('odometro_inicial, odometro_final').eq('fecha', fechaHoyStr).maybeSingle();
                
                if (cierreHoy) {
                    odometroBaseCisterna = parseFloat(cierreHoy.odometro_final || cierreHoy.odometro_inicial) || 0;
                }
                document.getElementById('lblOdometroBaseCisterna').innerText = `Odómetro Base Cisterna: ${odometroBaseCisterna.toLocaleString('es-CL')}`;

            } catch(e) { console.error("Error inicializando carga flota:", e); }
        };

        function filtrarPatentes(input) {
            let texto = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (texto.length > 6) texto = texto.substring(0, 6);
            input.value = texto;
            const cajaSugerencias = document.getElementById('sugerenciasPatentes');
            cajaSugerencias.innerHTML = '';
            const listaPatentes = Object.keys(diccionarioVehiculos);

            if (texto.length === 0 || listaPatentes.length === 0) { 
                cajaSugerencias.style.display = 'none'; 
                document.getElementById('txtPatenteVisual').value = '';
                return; 
            }

            const filtradas = listaPatentes.filter(pat => pat.startsWith(texto));
            if (filtradas.length > 0) {
                cajaSugerencias.style.display = 'block';
                filtradas.forEach(pat => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = pat;
                    div.onclick = function() { 
                        input.value = pat; 
                        let infoV = diccionarioVehiculos[pat];
                        document.getElementById('txtPatenteVisual').value = `${infoV.marca_modelo} (${infoV.conductor_titular})`;
                        cajaSugerencias.style.display = 'none';
                        consultarUltimoOdometroVehiculo(pat);
                    };
                    cajaSugerencias.appendChild(div);
                });
            } else { cajaSugerencias.style.display = 'none'; }
        }

        async function consultarUltimoOdometroVehiculo(patente) {
            try {
                const { data, error } = await _supabase.from('cargas_flota').select('nuevo_odometro').eq('patente', patente).order('id', { ascending: false }).limit(1);
                if (!error && data && data.length > 0) {
                    ultimoOdometroVehiculoReg = parseFloat(data[0].nuevo_odometro) || 0;
                } else { ultimoOdometroVehiculoReg = 0; }
                document.getElementById('txtUltimoOdometroVehiculo').innerText = `Último registrado en vehículo: ${ultimoOdometroVehiculoReg.toLocaleString('es-CL')} Km`;
            } catch (err) {
                ultimoOdometroVehiculoReg = 0;
                document.getElementById('txtUltimoOdometroVehiculo').innerText = 'Sin registro previo o error de red';
            }
        }

        function bloquearLetrasCientificas(e) { if (['e', 'E', '+', '-'].includes(e.key)) e.preventDefault(); }

        function cambiarPaso(nuevoPaso) {
            document.getElementById(`step-${pasoActual}`).classList.remove('active');
            pasoActual = nuevoPaso;
            document.getElementById(`step-${pasoActual}`).classList.add('active');
            document.getElementById('lblStepIndicator').innerText = `Paso ${pasoActual} de ${totalPasos}`;
            document.getElementById('lblStepTitle').innerText = nombresPasos[pasoActual - 1];

            if (pasoActual === 5) {
                document.getElementById('resPatente').innerText = document.getElementById('txtPatente').value.trim().toUpperCase();
                document.getElementById('resLitros').innerText = `${parseFloat(document.getElementById('txtLitros').value || 0).toLocaleString('es-CL')} L`;
                document.getElementById('resOdometroBomba').innerText = parseFloat(document.getElementById('txtOdometroFinalBomba').value || 0).toLocaleString('es-CL');
            }

            setTimeout(() => {
                if(pasoActual === 1) document.getElementById('txtPatente').focus();
                if(pasoActual === 2) document.getElementById('txtLitros').focus();
                if(pasoActual === 3) document.getElementById('txtOdometro').focus();
                if(pasoActual === 4) document.getElementById('txtOdometroFinalBomba').focus();
                if(pasoActual === 5) document.getElementById('txtPersonaCarga').focus();
            }, 100);
        }

        async function validarYPasar(paso) {
            if (paso === 1) {
                const val = document.getElementById('txtPatente').value.trim().toUpperCase();
                if (val.length === 0) { alert('Debe ingresar una patente.'); return; }
                if (Object.keys(diccionarioVehiculos).length > 0 && !diccionarioVehiculos[val]) { alert('Esta patente no corresponde a la flota.'); return; }
                await consultarUltimoOdometroVehiculo(val);
            }
            if (paso === 2) {
                const val = parseFloat(document.getElementById('txtLitros').value);
                if (isNaN(val) || val <= 0) { alert('Ingrese una cantidad válida de litros.'); return; }
            }
            if (paso === 3) {
                const val = parseFloat(document.getElementById('txtOdometro').value);
                if (isNaN(val) || val < 0) { alert('Ingrese un odómetro válido en números.'); return; }
                if (val <= ultimoOdometroVehiculoReg) {
                    alert(`No puede ingresar un odómetro menor o igual al último del vehículo (${ultimoOdometroVehiculoReg.toLocaleString('es-CL')} Km).`);
                    return;
                }
            }
            if (paso === 4) {
                const odometroBomba = parseFloat(document.getElementById('txtOdometroFinalBomba').value);
                const litrosIngresados = parseFloat(document.getElementById('txtLitros').value) || 0;

                if (isNaN(odometroBomba) || odometroBomba < 0) { alert('Ingrese un odómetro/horómetro de bomba válido.'); return; }
                
                if (odometroBaseCisterna > 0 && odometroBomba <= odometroBaseCisterna) {
                    alert(`⚠️ Restricción de Coherencia:\nEl odómetro ingresado (${odometroBomba.toLocaleString('es-CL')}) no puede ser menor o igual al valor base anterior (${odometroBaseCisterna.toLocaleString('es-CL')}).`);
                    return;
                }

                // VALIDACIÓN "PILLA-BICICLETAS" CON AVISO DE AUDITORÍA
                if (odometroBaseCisterna > 0) {
                    let avanceContador = odometroBomba - odometroBaseCisterna;
                    if (Math.abs(avanceContador - litrosIngresados) > 0.5) {
                        let confirmarDesfase = confirm(`⚠️ ALERTA DE DESFASE (Pilla-Bicicletas):\n\nLos litros cargados son ${litrosIngresados} L, pero el contador de la bomba avanzó ${avanceContador.toFixed(2)} unidades (${odometroBaseCisterna} a ${odometroBomba}).\n\n¿Desea continuar de todas formas con este desfase?\n\nSERÁN ENVIADOS CORREOS DE AVISO A LOS ENTES CORRESPONDIENTES DE AUDITORÍA.`);
                        if (!confirmarDesfase) return;
                    }
                }
            }
            cambiarPaso(paso + 1);
        }

        async function verificarYProcesarCierreCisterna(odometroInicialHoy, fechaHoyStr) {
            const FECHA_INICIO_SISTEMA = "2026-11-01"; 
            let partes = fechaHoyStr.split('-');
            let fechaEvaluacion = new Date(partes[0], partes[1] - 1, partes[2]);
            fechaEvaluacion.setDate(fechaEvaluacion.getDate() - 1);

            while (true) {
                let anioEval = fechaEvaluacion.getFullYear();
                let mesEval = String(fechaEvaluacion.getMonth() + 1).padStart(2, '0');
                let diaEval = String(fechaEvaluacion.getDate()).padStart(2, '0');
                let fechaStr = `${anioEval}-${mesEval}-${diaEval}`;
                if (fechaStr < FECHA_INICIO_SISTEMA) break;

                const { data: cargasDia } = await _supabase.from('cargas_flota').select('id').gte('fecha_hora', fechaStr + ' 00:00:00').lte('fecha_hora', fechaStr + ' 23:59:59').limit(1);
                const { data: ventasDia } = await _supabase.from('ventas_combustible').select('id').gte('fecha_hora', fechaStr + ' 00:00:00').lte('fecha_hora', fechaStr + ' 23:59:59').limit(1);

                let huboMovimiento = (cargasDia && cargasDia.length > 0) || (ventasDia && ventasDia.length > 0);
                if (huboMovimiento) {
                    await _supabase.from('cierre_diario_cisterna').upsert([{ fecha: fechaStr, odometro_final: odometroInicialHoy }], { onConflict: ['fecha'] });
                    break; 
                } else {
                    await _supabase.from('cierre_diario_cisterna').upsert([{ fecha: fechaStr, odometro_inicial: odometroInicialHoy, odometro_final: odometroInicialHoy, observacion: 'Jornada Sin Movimiento / Inactiva' }], { onConflict: ['fecha'] });
                    fechaEvaluacion.setDate(fechaEvaluacion.getDate() - 1);
                }
            }
        }

        async function finalizarCarga(e) {
            e.preventDefault();
            const personaCargaVal = document.getElementById('txtPersonaCarga').value.trim();
            if (!personaCargaVal) { alert('Debe ingresar el nombre de la persona que realiza la carga.'); return; }

            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerText = 'Guardando carga...';

            const patente = document.getElementById('txtPatente').value.trim().toUpperCase();
            const litros = parseFloat(document.getElementById('txtLitros').value) || 0;
            let nuevoOdometroVehiculo = parseFloat(document.getElementById('txtOdometro').value) || 0;
            let odometroFinalBomba = parseFloat(document.getElementById('txtOdometroFinalBomba').value) || 0;
            const personaCarga = personaCargaVal;
            
            const ahora = new Date();
            const anio = ahora.getFullYear();
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const dia = String(ahora.getDate()).padStart(2, '0');
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');

            const fechaSoloHoy = `${anio}-${mes}-${dia}`;
            const fechaHoraActual = `${anio}-${mes}-${dia} ${horas}:${minutos}:${segundos}`;

            try {
                const { data: cargasHoy } = await _supabase.from('cargas_flota').select('id').gte('fecha_hora', fechaSoloHoy + ' 00:00:00').lte('fecha_hora', fechaSoloHoy + ' 23:59:59');
                const { data: ventasHoy } = await _supabase.from('ventas_combustible').select('id').gte('fecha_hora', fechaSoloHoy + ' 00:00:00').lte('fecha_hora', fechaSoloHoy + ' 23:59:59');

                let totalMovsHoy = (cargasHoy ? cargasHoy.length : 0) + (ventasHoy ? ventasHoy.length : 0);

                if (totalMovsHoy === 0) {
                    let odometroCisternaParaGuardar = odometroFinalBomba - litros;
                    await _supabase.from('cierre_diario_cisterna').upsert([{ fecha: fechaSoloHoy, odometro_inicial: odometroCisternaParaGuardar, odometro_final: odometroFinalBomba }], { onConflict: ['fecha'] });
                    await verificarYProcesarCierreCisterna(odometroCisternaParaGuardar, fechaSoloHoy);
                } else {
                    // UPSERT: Sobreescribe limpiamente el odómetro final en el cierre diario de cisterna
                    await _supabase.from('cierre_diario_cisterna').upsert([{ fecha: fechaSoloHoy, odometro_final: odometroFinalBomba }], { onConflict: ['fecha'] });
                }

                const datosVehiculo = diccionarioVehiculos[patente] || { tipo: 'GENERAL', marca_modelo: 'NO ESPECIFICADO', conductor_titular: 'SIN ASIGNAR' };

                const { error: errInsert } = await _supabase.from('cargas_flota').insert([
                    {
                        fecha_hora: fechaHoraActual,
                        patente: patente,
                        tipo: datosVehiculo.tipo,
                        marca_modelo: datosVehiculo.marca_modelo,
                        conductor_titular: datosVehiculo.conductor_titular,
                        persona_carga: personaCarga,
                        odometro_anterior: ultimoOdometroVehiculoReg,
                        nuevo_odometro: nuevoOdometroVehiculo,
                        litros: litros
                    }
                ]);

                if (errInsert) throw errInsert;

                alert('¡Carga a flota registrada con éxito y control de cisterna actualizado!');
                window.location.href = 'mobile_index.html';

            } catch (err) {
                alert('Error en el proceso: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Carga';
            }
        }
    </script>
</body>
</html>
